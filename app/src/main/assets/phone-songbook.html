<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>窝牛 · 手机点歌</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#111216;color:#f3f0e9;font:15px system-ui,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:max(14px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;margin:3px 0}header small{font-size:10px;color:#dfc28e}.search{display:flex;gap:8px;margin:13px 0 10px}input{min-width:0;flex:1;background:#1c1d23;border:1px solid #ffffff18;border-radius:12px;color:inherit;padding:11px;font:inherit}button{font:inherit;border:0;border-radius:10px;background:#dfc28e;color:#29231b;padding:10px;min-height:42px;touch-action:manipulation}button:disabled{opacity:.5}nav{display:flex;gap:5px;flex:none}nav button{flex:1;min-width:0;font-size:12px;padding:9px 3px;background:#272830;color:#aaa8b1}nav button.on{background:#dfc28e;color:#29231b}#notice{min-height:27px;font-size:12px;line-height:1.6;color:#c7b592;padding:5px 0}#sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:#92909a;flex:none}#sub button{font-size:11px;padding:6px 9px;min-height:32px;background:#272830;color:#dfc28e}main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;overscroll-behavior:contain;padding:2px 0 12px}.song{display:flex;align-items:center;gap:9px;background:#1c1d23;border:1px solid #ffffff0c;border-radius:13px;padding:13px 11px;margin:8px 0;min-height:78px}.song>div{flex:1;min-width:0}.song b{display:block;line-height:1.4;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.song small{display:block;font-size:12px;color:#a7a3ad;line-height:1.5;margin-top:5px}.song .reason{color:#dfc28e;font-size:11px}.song button{font-size:12px;flex:none;padding:8px;min-width:48px}.song button.secondary{background:#272830;color:#b5ab98;font-size:11px;margin-left:4px}.artist{width:100%;display:flex;align-items:center;text-align:left;gap:12px;margin:8px 0;background:#1c1d23;color:#f3f0e9;min-height:68px}.avatar{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:#312d26;color:#dfc28e;position:relative;overflow:hidden}.avatar img{position:absolute;width:100%;height:100%;object-fit:cover}.now{font-size:12px;color:#dfc28e;padding-top:9px;border-top:1px solid #ffffff0c;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:#8d8993;padding:30px 6px;line-height:1.8}.more{display:block;width:100%;margin:12px 0;background:#272830;color:#dfc28e}.console{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 0}.console h2,.console p{grid-column:1/-1;margin:3px 0}.console h2{font-size:20px}.console p{font-size:12px;color:#8d8993}.console button{min-height:55px}.rank{font-size:19px;color:#dfc28e;min-width:22px}
button{border:1px solid #ffffff0b;border-radius:11px;box-shadow:inset 0 1px 0 #ffffff08}h1{font-weight:600;letter-spacing:.5px}header small{letter-spacing:1px}nav{padding:4px;background:#191a20;border:1px solid #ffffff0a;border-radius:13px;gap:3px}nav button{background:transparent;border-color:transparent;color:#9996a2;border-radius:9px}nav button.on{background:#dfc28e14;border-color:#dfc28e35;color:#dfc28e}.song{border-radius:15px;padding:15px 12px}.song b{font-weight:600}.song button{background:linear-gradient(135deg,#f0d9af,#d9bb84);color:#29231b;border-radius:9px;box-shadow:none}.song button.secondary{background:#28272c;color:#b1a899}.song button:disabled{background:#dfc28e10;color:#dfc28e;opacity:.75}#sub button{border:1px solid #ffffff0c;border-radius:8px}#sub{padding-bottom:3px}.search input{background:#18191e;border-color:#ffffff13}.search>button{background:linear-gradient(135deg,#f0d9af,#d9bb84);font-weight:500}.artist{border:1px solid #ffffff0c;border-radius:14px}.now{padding-top:12px;color:#bbaa8e}.console button{background:#25262e;color:#dfc28e;border-color:#dfc28e24}button:focus-visible,input:focus-visible{outline:2px solid #f5d99f;outline-offset:2px}
</style></head><body><header><div><small>WONIU FAMILY KTV</small><h1>想唱哪一首？</h1></div><small>向上滑，继续选歌</small></header><div class="search"><input id="keyword" placeholder="歌名、歌手或拼音首字母"><button id="search">搜索</button></div><nav><button id="recommendations" class="on">想唱</button><button id="library">曲库</button><button id="artists">歌星</button><button id="charts">热榜</button><button id="queue">已点</button><button id="console">控制</button></nav><div id="notice" role="status"></div><div id="sub"></div><main id="list"></main><div class="now" id="now">正在连接点歌台…</div><script>
const token=new URLSearchParams(location.search).get('token'),el=id=>document.getElementById(id),tabs=['recommendations','library','artists','charts','queue','console'];
let tab='recommendations',selectedArtist='',scope='chinese',chartSource='all',items=[],allItems=[],after='',hasMore=false,loading=false,sequence=0,controller=null,queued=new Set(),queueRows=[],player={},discovery={},queueSignature='',timer,refreshing=false,segmentStart='',segments=[],feedOffset=0,recommendationSignature='';
async function api(path,body,signal){const response=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'X-Woniu-Pair':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal});const result=await response.json();if(!result.ok)throw Error(result.message||'连接失败');return result.data}
function node(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}function button(label,action,cls){const b=node('button',label,cls);b.onclick=action;return b}function notice(text){el('notice').textContent=text}
function updateButtons(){document.querySelectorAll('button[data-order-id]').forEach(b=>{const already=queued.has(b.dataset.orderId);b.disabled=already||b.dataset.available==='false';b.textContent=already?'已点':b.dataset.pending==='true'?'确认版本':b.dataset.available==='false'?'未收录':player.state==='playing'?'点歌':'立即唱'})}
function songRow(item){const song=tab==='charts'?(item.song||{title:item.title,artist:(item.artists||[]).join(' / ')}):tab==='queue'||tab==='recommendations'?item.song:item;const row=node('article','','song'),info=node('div');info.append(node('b',song.title),node('small',[song.artist,song.language].filter(Boolean).join(' · ')));if(item.reason)info.append(node('small',item.reason,'reason'));if(tab==='charts')row.append(node('span',String(item.rank),'rank'));row.append(info);
 const pick=button('点歌',async()=>{if(queued.has(String(song.id)))return;pick.disabled=true;try{await api('order',{id:String(song.id),origin:item.origin||''});queued.add(String(song.id));notice('已点歌');await refreshState();updateButtons()}catch(e){notice(e.message);updateButtons()}});pick.dataset.orderId=String(song.id||'');pick.dataset.available=tab==='charts'&&!item.available?'false':'true';if(tab==='charts'&&item.status==='confirm'){pick.dataset.available='true';pick.dataset.pending='true';pick.textContent='确认版本';pick.onclick=()=>confirmMatch(item)}row.append(pick);
 if(tab==='queue'){const actions=node('span');actions.append(button('置顶',()=>command('top',{queue_id:item.queueId}),'secondary'),button('删除',()=>command('cancel',{queue_id:item.queueId}),'secondary'));row.append(actions)}
 if(tab==='recommendations'){const hide=button('×',async()=>{try{const result=await api('recommendations/dismiss',{id:String(song.id)});setRecommendations(result);render()}catch(e){notice(e.message)}},'secondary');hide.setAttribute('aria-label','暂不推荐'+song.title);row.append(hide)}return row}
function artistRow(artist){const b=button('',()=>{selectedArtist=artist.name;reset();load()});b.className='artist';const avatar=node('span',artist.name.slice(0,1),'avatar'),image=node('img');image.alt='';image.loading='lazy';image.src='/api/artist-photo?name='+encodeURIComponent(artist.name)+'&token='+encodeURIComponent(token);image.onerror=()=>image.remove();avatar.append(image);b.append(avatar,node('b',artist.name));return b}
function renderSub(){el('sub').replaceChildren();if(tab==='artists'){if(selectedArtist)el('sub').append(button('‹ 返回歌星',()=>{selectedArtist='';reset();load()}),node('b',selectedArtist));else for(const [value,label] of [['chinese','华语'],['all','全部'],['foreign','外语']])el('sub').append(button((scope===value?'✓ ':'')+label,()=>{scope=value;reset();load()}))}
 if(tab==='recommendations'){el('sub').append(button('换一批',()=>{reset();load(true)}),button('备份到115',async()=>{try{notice((await api('recommendations/backup',{})).status)}catch(e){notice(e.message)}}));}
 if(tab==='charts'){for(const [value,label] of [['all','综合'],['qq','抖音'],['netease','网易'],['kugou','酷狗']])el('sub').append(button((chartSource===value?'✓ ':'')+label,()=>{chartSource=value;reset();setChartItems();render()}));el('sub').append(button('更新',()=>{reset();load(true)}))}
}
function render(append=false){renderSub();if(tab==='console'){renderConsole();return}const list=el('list');list.querySelectorAll('.load-more').forEach(n=>n.remove());if(!append)list.replaceChildren();const visible=append?items.slice(list.querySelectorAll('.song,.artist').length):items;for(const item of visible)list.append(tab==='artists'&&!selectedArtist?artistRow(item):songRow(item));if(!items.length)list.append(node('p',loading?'加载中…':'暂无歌曲，先在电视恢复曲库或点几首喜欢的歌','empty'));
 if(hasMore){const more=button(items.length>=200?'继续浏览下一段':'加载更多',()=>nextRows(),'more load-more');list.append(more)}if(segments.length&&!append)list.prepend(button('‹ 返回上一段',()=>{after=segments.pop();segmentStart=after;items=[];load()},'more previous-segment'));updateButtons();if(!refreshing)refreshState()}
function reset(){sequence++;controller?.abort();loading=false;items=[];allItems=[];after='';hasMore=false;segmentStart='';segments=[];feedOffset=0;el('list').scrollTop=0}
function paged(){return tab==='library'||tab==='artists'||tab==='queue'}
function setRecommendations(result){allItems=result.items||[];items=allItems.slice(0,200);hasMore=false;recommendationSignature=JSON.stringify(allItems);if(result.warning)notice(result.warning);else if(result.backupStatus)notice(result.backupStatus);else notice(result.learning?'根据本机演唱与点歌偏好推荐':'先从曲库发现，唱过后会越来越懂你')}
function setChartItems(){allItems=chartSource==='all'?discovery.recommendations||[]:(discovery.items||[]).filter(x=>x.source===chartSource);items=allItems.slice(feedOffset,feedOffset+200);hasMore=feedOffset+items.length<allItems.length}
async function load(refresh=false,append=false){if(loading)return;loading=true;const request=++sequence;controller=new AbortController();const signal=controller.signal;
 try{if(paged()){const path=tab==='queue'?'phone-queue?':'phone-'+(tab==='artists'&&!selectedArtist?'artists?scope='+scope:'songs?artist='+encodeURIComponent(selectedArtist));const result=await api(path+'&after='+encodeURIComponent(after)+'&keyword='+encodeURIComponent(el('keyword').value.trim()),null,signal);if(request!==sequence)return;items=append?items.concat(result.items):result.items;after=result.after;hasMore=result.hasMore}
 else if(tab==='recommendations'){const result=await api('recommendations'+(refresh?'?refresh=1':''),null,signal);if(request!==sequence)return;setRecommendations(result)}
 else if(tab==='charts'){const result=await api('discovery'+(refresh?'?refresh=1':''),null,signal);if(request!==sequence)return;discovery=result;setChartItems()}
 else if(tab==='queue'){await refreshState();items=queueRows.slice(0,200)}else if(tab==='console'){await refreshState()}
 if(request===sequence)render(append)
 }catch(e){if(e.name!=='AbortError'){notice(e.message);if(!append)el('list').replaceChildren(button('重试',()=>load(refresh),'more'))}}finally{if(request===sequence)loading=false}}
async function nextRows(){if(loading||!hasMore)return;if(paged()){if(items.length>=200){segments.push(segmentStart);segmentStart=after;items=[];el('list').scrollTop=0;await load()}else await load(false,true)}else{feedOffset+=200;setChartItems();render();el('list').scrollTop=0}}
async function refreshState(){if(refreshing)return;refreshing=true;try{const ids=[...document.querySelectorAll('button[data-order-id]')].map(b=>b.dataset.orderId).filter(Boolean);const q=await api('phone-state',{ids:ids.slice(0,200)});player=q.player;queueRows=q.list||[];queued=new Set(q.queuedIds||[]);el('now').textContent=(q.playing?'正在唱 · '+q.playing.song.title:'点歌台已就绪')+' · '+queueRows.length+(q.hasMore?'+':'')+' 首待唱';const sig=JSON.stringify(queueRows.map(x=>[x.queueId,x.song.id]));if(tab==='queue'&&sig!==queueSignature&&!loading){queueSignature=sig;items=queueRows;after=q.after;hasMore=q.hasMore;segmentStart='';segments=[];render()}else if(tab==='console')renderConsole();updateButtons()}catch(e){el('now').textContent='连接中断，请检查 Wi-Fi 或重新扫码'}finally{refreshing=false}}
async function command(action,params={}){try{await api('control',{action,params});await refreshState();notice('操作已完成')}catch(e){notice(e.message)}}
function renderConsole(){const box=node('section','','console');box.append(node('h2',player.title||'等待点歌'),node('p',(player.artist||'')+' · 音量 '+(player.volume??0)+'%'));for(const [label,action,params] of [[player.state==='playing'?'暂停':'继续',player.state==='playing'?'pause':'play',{}],['下一首','next',{}],['重唱','restart',{}],[player.vocalMode==='accompaniment'?'伴奏 · 切原唱':'原唱 · 切伴奏','player_action',{value:'toggle_vocal'}],['音量 −','volume',{delta:-1}],['音量 ＋','volume',{delta:1}]])box.append(button(label,()=>command(action,params)));el('list').replaceChildren(box)}
async function confirmMatch(item){try{const rows=await api('chart-candidates?title='+encodeURIComponent(item.title));el('sub').replaceChildren(button('‹ 返回榜单',render),node('b','确认歌曲版本'));el('list').replaceChildren();for(const song of rows)el('list').append(button(song.title+' · '+song.artist,async()=>{discovery=await api('chart-match',{title:item.title,artists:item.artists,id:String(song.id)});setChartItems();render()}))}catch(e){notice(e.message)}}
function setTab(value){tab=value;selectedArtist='';el('keyword').value='';el('keyword').placeholder=value==='artists'?'输入歌星中文名':'歌名、歌手或拼音首字母';for(const name of tabs)el(name).classList.toggle('on',value===name);reset();notice('');load()}
for(const name of tabs)el(name).onclick=()=>setTab(name);el('search').onclick=()=>{if(tab!=='artists'){tab='library';for(const name of tabs)el(name).classList.toggle('on',name==='library')}reset();load()};el('keyword').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(['library','artists'].includes(tab)){reset();load()}},350)};
el('list').addEventListener('scroll',()=>{const list=el('list');if(paged()&&items.length<200&&list.scrollHeight-list.scrollTop-list.clientHeight<180)nextRows()},{passive:true});let polling=false,ticks=0;setInterval(async()=>{if(document.hidden||polling)return;polling=true;try{await refreshState();if(tab==='recommendations'&&++ticks%8===0&&!loading){const result=await api('recommendations');if(JSON.stringify(result.items)!==recommendationSignature){setRecommendations(result);render()}else if(result.backupStatus)notice(result.backupStatus)}}catch(e){notice('更新暂时失败：'+e.message)}finally{polling=false}},2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshState()});refreshState().then(()=>load());
</script></body></html>
