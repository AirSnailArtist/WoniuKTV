<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,'Noto Sans CJK SC',sans-serif;color:#fff}body{user-select:none;-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;border:0;cursor:pointer}svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.shade{position:fixed;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.3));opacity:0;transition:opacity .2s;pointer-events:none}.glass{position:fixed;left:4%;right:4%;bottom:5%;padding:24px 28px 20px;border-radius:24px;background:rgba(21,22,27,.96);border:1px solid rgba(255,255,255,.16);box-shadow:0 20px 80px #0005;opacity:0;visibility:hidden;transform:translateY(20px);transition:opacity .2s,transform .2s}.active .shade,.active .glass{opacity:1}.active .glass{visibility:visible;transform:none}.head{display:flex;align-items:center;gap:15px}.music{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#dfc28e22;color:#dfc28e;flex:none}.song{min-width:0;flex:1}.song h1{font-size:26px;letter-spacing:1px;margin:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.song p{font-size:14px;color:#c1cdd3;margin:5px 0 0}.state-tag{font-size:13px;color:#dfc28e;display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;background:#dfc28e;border-radius:50%}.more{width:48px;height:48px;border-radius:50%;background:#ffffff0d;font-size:28px}.progress{display:flex;align-items:center;gap:15px;margin:20px 0 19px}.time{font-size:15px;font-variant-numeric:tabular-nums;color:#d5dee3;min-width:42px}.time:last-child{text-align:right}input[type=range]{appearance:none;-webkit-appearance:none;flex:1;height:5px;border-radius:8px;background:linear-gradient(to right,#dfc28e var(--progress,0%),#ffffff35 var(--progress,0%));outline:none}input::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:19px;height:19px;border-radius:50%;background:#f0d9af;box-shadow:0 0 0 5px #f0d9af15}.controls{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}.control{height:103px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;background:rgba(255,255,255,.055);border:1px solid #ffffff08;border-radius:15px;font-size:18px;font-weight:550;letter-spacing:.5px}.control svg{width:31px;height:31px}.control.primary{background:#dfc28e;color:#29231b;border-color:transparent;box-shadow:0 5px 25px #0002}.control.primary svg{fill:currentColor;stroke-width:0}.control:hover{background:#ffffff17}.control.primary:hover{background:#f0d9af}button:focus-visible,input:focus-visible{outline:3px solid #f0d9af;outline-offset:5px;box-shadow:0 0 0 8px #f0d9af14}.hint{text-align:center;font-size:11px;color:#aab8c2;margin-top:17px;letter-spacing:1px}.popup-mask{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center}.popup-mask.open{display:flex}.popup{width:min(660px,86vw);max-height:88vh;overflow:auto;background:rgba(24,25,31,.98);border:1px solid #ffffff22;border-radius:24px;padding:26px;box-shadow:0 20px 80px #0006}.popup-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.popup-head h2{font-size:25px;margin:0}.close{width:46px;height:46px;background:#ffffff0b;border-radius:50%;font-size:25px}.option{width:100%;min-height:62px;border-radius:12px;background:#ffffff08;margin:5px 0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;text-align:left;font-size:19px;line-height:1.4}.option span:last-child{color:#dfc28e;font-size:23px;margin-left:15px}.note{font-size:14px;line-height:1.8;color:#aebdc8;margin:17px 4px 0}.loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}.loading.show{display:flex}.loading>div{background:#101820bb;border:1px solid #ffffff1a;padding:18px 28px;border-radius:16px;font-size:19px;display:flex;gap:14px;align-items:center}.spinner{width:24px;height:24px;border:3px solid #ffffff33;border-top-color:#dfc28e;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:720px){.glass{padding:17px;left:3%;right:3%;bottom:4%}.song h1{font-size:21px}.control{height:85px;font-size:15px;gap:7px}.controls{gap:7px}.control svg{width:25px;height:25px}.progress{margin:14px 0}.hint{display:none}.state-tag{display:none}}
.queue-panel{justify-content:flex-end;bottom:var(--queue-bottom,210px);pointer-events:none;background:transparent}.queue-panel .popup{pointer-events:auto;width:50vw;height:100%;max-height:100%;border-radius:24px 0 0 24px}.glass{border-radius:20px;border-color:#dfc28e24;box-shadow:0 16px 55px #0004}.control{border-radius:12px;background:#ffffff05;border-color:#ffffff0d;font-weight:500}.control.primary{background:linear-gradient(135deg,#f0d9af,#d9bb84);border-color:#f0d9af40}.music{border:1px solid #dfc28e28;background:#dfc28e0c}.song h1{font-weight:600}.option{border:1px solid #ffffff0c;border-radius:10px}.popup{border-radius:18px;border-color:#dfc28e24}button:focus-visible,input:focus-visible{outline:2px solid #f5d99f;outline-offset:3px;box-shadow:0 0 0 5px #dfc28e20}
</style></head><body><div class="shade"></div><div class="loading" id="loading"><div><span class="spinner"></span>正在连接 115…</div></div><section class="glass" id="panel"><header class="head"><div class="music" id="musicIcon"></div><div class="song"><h1 id="title">窝牛家庭KTV</h1><p id="artist"></p></div><span class="state-tag"><i class="dot"></i><span id="status">正在播放</span></span><button class="more" aria-label="更多" onclick="openMore()">···</button></header><div class="progress"><span class="time" id="elapsed">0:00</span><input id="seek" aria-label="播放进度" type="range" min="0" max="1000" value="0"><span class="time" id="duration">0:00</span></div><div class="controls"><button class="control" onclick="action('back')"><span data-icon="queue"></span>返回点歌</button><button class="control" onclick="action('restart')"><span data-icon="restart"></span>重唱</button><button class="control primary" id="pause" onclick="action('pause')"><span id="pauseIcon"></span><span id="pauseText">暂停</span></button><button class="control" onclick="action('next')"><span data-icon="next"></span>下一首</button><button class="control" onclick="action('toggle_vocal')"><span data-icon="audio"></span><span id="vocalText">原唱</span></button><button class="control" onclick="openPicture()"><span data-icon="screen"></span>画面设置</button><button class="control" onclick="openQueue()"><span data-icon="queue"></span>已点</button></div><div class="hint">点击空白处收起 · 方向键选择 / 确认键操作 · 闲置 5 秒自动隐藏</div></section><div class="popup-mask" id="popupMask"><section class="popup" role="dialog" aria-modal="true"><header class="popup-head"><h2 id="popupTitle"></h2><button class="close" aria-label="关闭" onclick="closePopup()">×</button></header><div id="options"></div><p class="note" id="popupNote"></p></section></div><script>
const paths={music:'<path d="M9 18V5l12-2v13M9 8l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',restart:'<path d="M3 10a9 9 0 1 1 1 8M3 4v6h6"/>',pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',play:'<path d="M7 3l15 9-15 9z"/>',next:'<path d="M5 4l12 8L5 20z"/><path d="M20 4v16"/>',audio:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',screen:'<rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 22h8M12 18v4M6 8h4M6 8v4M18 14h-4M18 14v-4"/>',queue:'<path d="M9 6h12M9 12h12M9 18h12M3 6h.01M3 12h.01M3 18h.01"/>'};
function icon(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[name]+'</svg>'}document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));document.getElementById('musicIcon').innerHTML=icon('music');
let state={},shown=false,dragging=false;const byId=id=>document.getElementById(id);function fmt(ms){const s=Math.max(0,Math.floor((ms||0)/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function refresh(){try{state=JSON.parse(Player.state());byId('title').textContent=state.title||'窝牛家庭KTV';byId('artist').textContent=state.artist||'私人曲库 · 115 在线播放';byId('elapsed').textContent=fmt(state.position);byId('duration').textContent=state.duration?fmt(state.duration):'解析中';byId('seek').disabled=!state.duration;byId('vocalText').textContent=state.vocalMode==='accompaniment'?'伴奏':'原唱';if(!dragging){const p=state.duration?Math.round(state.position*1000/state.duration):0;byId('seek').value=p;byId('seek').style.setProperty('--progress',p/10+'%')}const playing=state.state==='playing';byId('pauseIcon').innerHTML=icon(playing?'pause':'play');byId('pauseText').textContent=playing?'暂停':'继续播放';byId('status').textContent={playing:'正在播放',paused:'已暂停',loading:'正在连接',error:'播放失败'}[state.state]||'准备播放';byId('loading').classList.toggle('show',state.state==='loading'&&!shown)}catch{}}
function action(name){Player.action(name);setTimeout(refresh,80)}window.setMenu=function(value){shown=value;document.body.classList.toggle('active',value);if(!value)byId('popupMask').classList.remove('open');else{refresh();setTimeout(()=>byId('pause').focus(),80)}};
document.body.addEventListener('click',()=>action('toggle_menu'));byId('panel').addEventListener('click',e=>e.stopPropagation());byId('popupMask').addEventListener('click',e=>{e.stopPropagation();if(e.target===byId('popupMask'))closePopup()});
function popup(title,items,note=''){Player.action('hold_menu');byId('popupTitle').textContent=title;byId('options').replaceChildren();for(const [label,command] of items){const b=document.createElement('button');b.className='option';const t=document.createElement('span');t.textContent=label;const arrow=document.createElement('span');arrow.textContent='›';b.append(t,arrow);b.onclick=()=>{closePopup();action(command)};byId('options').append(b)}byId('popupNote').textContent=note;byId('popupMask').classList.add('open');setTimeout(()=>byId('options').querySelector('button')?.focus(),80)}
window.closePopup=function(){byId('popupMask').classList.remove('queue-panel');if(!byId('popupMask').classList.contains('open'))return false;byId('popupMask').classList.remove('open');Player.action('interact');byId('pause').focus();return true};
function openPicture(){refresh();popup('画面与显示',[[state.fullscreen?'切换为小窗播放':'切换为全屏播放','toggle_fullscreen'],['保持原比例（推荐）','fit'],['裁切铺满','zoom'],['拉伸铺满','fill']],'4:3 老 MV 建议保持原比例。裁切会丢失边缘画面，拉伸会改变人物比例。')}
function openAudio(){popup('原唱 / 伴奏',[['原唱','original'],['伴奏','accompaniment']],'自动选择本曲原唱或伴奏；普通 MV 可能没有伴奏版本。')}
function openQueue(){if(byId('popupMask').classList.contains('queue-panel')&&byId('popupMask').classList.contains('open')){closePopup();return}Player.action('hold_menu');const q=JSON.parse(Player.queue());popup('已点歌曲 · '+(q.list||[]).length+' 首待唱',[],q.playing?'正在唱：'+q.playing.song.title:'还没有正在播放的歌曲');const mask=byId('popupMask');mask.classList.add('queue-panel');mask.style.setProperty('--queue-bottom',(innerHeight-byId('panel').getBoundingClientRect().top+12)+'px');for(const [i,item] of (q.list||[]).entries()){const row=document.createElement('div');row.className='option';row.textContent=(i+1)+'　'+item.song.title+' · '+item.song.artist;byId('options').append(row)}}
function openMore(){popup('更多播放操作',[['重新获取播放地址并重试','retry'],['回到歌曲开头','restart']],'播放地址由 115 实时获取，账号信息仅保存在设备本机。')}
const seek=byId('seek');seek.addEventListener('pointerdown',()=>{dragging=true;Player.action('hold_menu')});seek.addEventListener('input',()=>{seek.style.setProperty('--progress',seek.value/10+'%');byId('elapsed').textContent=fmt(state.duration*seek.value/1000)});seek.addEventListener('change',()=>{Player.seek(Number(seek.value));dragging=false;Player.action('interact')});seek.addEventListener('pointerup',()=>{dragging=false;Player.action('interact')});
window.remoteConfirm=function(){const e=document.activeElement;if(e===seek)action('pause');else if(e&&e.tagName==='BUTTON')e.click();else byId('pause').focus()};
window.addEventListener('keydown',e=>{const modal=byId('popupMask').classList.contains('open');if(modal)Player.action('hold_menu');else Player.action('interact');if(['Enter',' '].includes(e.key)){e.preventDefault();remoteConfirm();return}if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;if(document.activeElement===seek&&['ArrowLeft','ArrowRight'].includes(e.key))return;const scope=modal?byId('popupMask'):byId('panel');const list=[...scope.querySelectorAll('button,input')].filter(x=>x.getClientRects().length);const current=document.activeElement;if(!list.includes(current)){e.preventDefault();list[0]?.focus();return}const r=current.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,score=Infinity;for(const x of list){if(x===current)continue;const a=x.getBoundingClientRect(),dx=a.left+a.width/2-cx,dy=a.top+a.height/2-cy;const h=e.key==='ArrowLeft'||e.key==='ArrowRight',primary=h?dx:dy,secondary=h?dy:dx;if((['ArrowRight','ArrowDown'].includes(e.key)?primary:-primary)<3)continue;const value=Math.abs(primary)+3*Math.abs(secondary);if(value<score){best=x;score=value}}if(best){e.preventDefault();best.focus();best.scrollIntoView({block:'nearest'})}});refresh();setInterval(refresh,300);
</script></body></html>
